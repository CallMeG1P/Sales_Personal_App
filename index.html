<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Map Tracker & CRM</title>
  
  <!-- Leaflet CSS & JS (Peta Gratis) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 0; background: #f4f6f8; color: #333; }
    
    /* LOGIN CONTAINER */
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; background: #eef2f5; }
    .login-card { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .login-card h2 { text-align: center; margin-top: 0; margin-bottom: 20px; color: #007bff; }

    /* MAIN APP CONTAINER */
    #app-content { display: none; padding: 15px; max-width: 1100px; margin: 0 auto; }
    
    /* NAVBAR */
    .navbar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .navbar h3 { margin: 0; font-size: 18px; color: #007bff; }
    .btn-logout { background: #dc3545; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* LAYOUT GRID */
    #map { height: 350px; width: 100%; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ddd; z-index: 1; }
    .card { background: #fff; padding: 18px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h3 { margin-top: 0; font-size: 16px; border-bottom: 2px solid #f4f6f8; padding-bottom: 8px; }

    /* FORM STYLES */
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: bold; color: #555; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    
    .btn { background: #007bff; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; }
    .btn-danger { background: #dc3545; }

    /* TABLE STYLES */
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #eee; text-align: left; }
    th { background: #f8f9fa; color: #444; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-rencana { background: #fff3cd; color: #856404; }
    .badge-sudah { background: #d4edda; color: #155724; }
    .distance-tag { color: #007bff; font-weight: bold; }

    /* TABS */
    .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; background: #e9ecef; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: #007bff; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <!-- 1. LAMAN LOGIN -->
  <div id="login-section" class="login-wrapper">
    <div class="login-card">
      <h2>Sales CRM Login</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom: 12px;">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="Masukkan email..." required>
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Masukkan password..." required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Masuk / Login</button>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD & APLIKASI UTAMA (SETELAH LOGIN) -->
  <div id="app-content">
    
    <!-- NAVBAR -->
    <div class="navbar">
      <h3>📍 Sales School Tracker</h3>
      <button onclick="handleLogout()" class="btn-logout">Logout</button>
    </div>

    <!-- PETA UTAMA -->
    <div id="map"></div>

    <!-- TOMBOL TAB NAVIGASI -->
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('sekolah-tab', this)">📍 Daftar Sekolah (Terdekat)</button>
      <button class="tab-btn" onclick="switchTab('catatan-tab', this)">📝 Catatan & Laporan Pribadi</button>
    </div>

    <!-- TAB 1: MANAJEMEN SEKOLAH -->
    <div id="sekolah-tab" class="tab-content active">
      
      <!-- FORM INPUT / EDIT SEKOLAH -->
      <div class="card">
        <h3 id="formTitle">Tambah Data Sekolah</h3>
        <input type="hidden" id="editId">
        
        <div class="form-grid">
          <div class="form-group">
            <label>Nama Sekolah</label>
            <input type="text" id="namaSekolah" placeholder="Contoh: SMAN 1 Bandung" required>
          </div>
          <div class="form-group">
            <label>Status Kunjungan</label>
            <select id="statusKunjungan">
              <option value="Rencana Kunjungan">Rencana Kunjungan</option>
              <option value="Sudah Dikunjungi">Sudah Dikunjungi</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tanggal Kunjungan</label>
            <input type="date" id="tglKunjungan">
          </div>
          <div class="form-group">
            <label>Potensi Revenue (Rp)</label>
            <input type="number" id="potensiRevenue" placeholder="0">
          </div>
          <div class="form-group">
            <label>Latitude</label>
            <input type="text" id="latitude" placeholder="Klik di peta / GPS" required>
          </div>
          <div class="form-group">
            <label>Longitude</label>
            <input type="text" id="longitude" placeholder="Klik di peta / GPS" required>
          </div>
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label>Kontak Person (CP / HP)</label>
          <input type="text" id="kontakPerson" placeholder="Misal: Pak Budi - Kepsek (0812xxx)">
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label>Catatan Lapangan / Hasil Obrolan</label>
          <textarea id="catatan" rows="2" placeholder="Catat detail penawaran atau janji temu..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button onclick="simpanSekolah()" class="btn" id="btnSimpanSekolah">Simpan Data</button>
          <button onclick="resetFormSekolah()" class="btn btn-secondary">Batal / Reset</button>
          <button onclick="getGPSLocation()" class="btn" style="background:#28a745; margin-left:auto;">📍 Lokasi Saya Saat Ini</button>
        </div>
      </div>

      <!-- TABEL DAFTAR SEKOLAH (SORTED BY NEAREST) -->
      <div class="card">
        <h3>Daftar Sekolah (Diurutkan dari Jarak Terdekat)</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Jarak</th>
                <th>Nama Sekolah</th>
                <th>Status</th>
                <th>Tgl Visit</th>
                <th>Potensi Revenue</th>
                <th>Kontak & Catatan</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelSekolahBody">
              <!-- Data Sekolah Di-render Otomatis -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- TAB 2: CATATAN PRIBADI / DASHBOARD LAPORAN -->
    <div id="catatan-tab" class="tab-content">
      
      <!-- FORM CATATAN PRIBADI -->
      <div class="card">
        <h3 id="noteFormTitle">Tambah Catatan Pribadi / Laporan</h3>
        <input type="hidden" id="editNoteId">
        
        <div class="form-group" style="margin-bottom: 10px;">
          <label>Judul Catatan / Target</label>
          <input type="text" id="judulCatatan" placeholder="Contoh: Evaluasi Target Minggu Ke-2">
        </div>
        <div class="form-group" style="margin-bottom: 10px;">
          <label>Isi Ringkasan / Laporan</label>
          <textarea id="isiCatatan" rows="4" placeholder="Tulis strategi, catatan mandiri, atau evaluasi harian..."></textarea>
        </div>

        <div style="display: flex; gap: 10px;">
          <button onclick="simpanCatatan()" class="btn" id="btnSimpanNote">Simpan Catatan</button>
          <button onclick="resetFormNote()" class="btn btn-secondary">Batal</button>
        </div>
      </div>

      <!-- DAFTAR CATATAN PRIBADI -->
      <div class="card">
        <h3>Ringkasan Catatan Mandiri</h3>
        <div id="daftarCatatanContainer">
          <!-- Render Catatan -->
        </div>
      </div>

    </div>

  </div>

  <script>
    // ==========================================
    // 1. CONFIG SUPABASE
    // ==========================================
    // SAMAKAN DENGAN URL DAN ANON KEY DI SUPABASE KAMU
    const SUPABASE_URL = "https://oqvqbgpcgxkdsjsfwegz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_CYObrBKZgPIZtLpr14VcYA_W3Nez0oi";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map;
    let markers = [];
    let userLocation = null; // Storing [lat, lng]
    let currentSchoolsData = [];

    // ==========================================
    // 2. AUTHENTICATION (LOGIN / LOGOUT)
    // ==========================================
    window.onload = async function() {
      // Cek apakah user sudah punya session login
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showApp();
      } else {
        showLogin();
      }
    };

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Login Gagal: " + error.message);
      } else {
        showApp();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      showLogin();
    }

    function showLogin() {
      document.getElementById('login-section').style.display = 'flex';
      document.getElementById('app-content').style.display = 'none';
    }

    function showApp() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      initMap();
      getUserGPSAndLoadData();
      loadCatatanPribadi();
    }

    // ==========================================
    // 3. PETA & GEOLOCATION SORTING
    // ==========================================
    function initMap() {
      if(map) return; // Mencegah re-inisialisasi
      map = L.map('map').setView([-6.9175, 107.6191], 12); // Default lokasi

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // Listener Klik di Peta
      map.on('click', function(e) {
        document.getElementById('latitude').value = e.latlng.lat.toFixed(6);
        document.getElementById('longitude').value = e.latlng.lng.toFixed(6);
      });
    }

    function getUserGPSAndLoadData() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLocation = [position.coords.latitude, position.coords.longitude];
            
            // Tambahkan Penanda Lokasi Saya di Peta (Warna Biru / Circle)
            L.circle(userLocation, {
              color: 'blue',
              fillColor: '#30f',
              fillOpacity: 0.3,
              radius: 100
            }).addTo(map).bindPopup("<b>Posisi Kamu Saat Ini</b>");

            map.setView(userLocation, 13);
            loadSekolahData();
          },
          (error) => {
            console.log("GPS Akses Ditolak/Gagal, Menggunakan lokasi default.");
            loadSekolahData();
          }
        );
      } else {
        loadSekolahData();
      }
    }

    function getGPSLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          document.getElementById('latitude').value = pos.coords.latitude.toFixed(6);
          document.getElementById('longitude').value = pos.coords.longitude.toFixed(6);
          alert("Lokasi GPS berhasil diambil!");
        });
      } else {
        alert("Fitur GPS tidak didukung di browser ini.");
      }
    }

    // Rumus Haversine untuk Menghitung Jarak (dalam KM)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 999999;
      const R = 6371; // Radius bumi KM
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      return R * c; 
    }

    // ==========================================
    // 4. CRUD DATA SEKOLAH
    // ==========================================
    async function loadSekolahData() {
      const { data, error } = await supabaseClient
        .from('sekolah_visits')
        .select('*');

      if (error) return alert("Gagal memuat sekolah: " + error.message);

      // Hitung Jarak jika Lokasi User Ada
      currentSchoolsData = data.map(item => {
        let dist = 999999;
        if (userLocation) {
          dist = calculateDistance(userLocation[0], userLocation[1], item.latitude, item.longitude);
        }
        return { ...item, distance: dist };
      });

      // Urutkan dari Jarak Terdekat
      currentSchoolsData.sort((a, b) => a.distance - b.distance);

      renderSekolahUI();
    }

    function renderSekolahUI() {
      // Clear markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      const tbody = document.getElementById('tabelSekolahBody');
      tbody.innerHTML = '';

      currentSchoolsData.forEach(item => {
        // Render Marker
        if (item.latitude && item.longitude) {
          const marker = L.marker([item.latitude, item.longitude]).addTo(map);
          marker.bindPopup(`
            <b>${item.nama_sekolah}</b><br>
            Status: ${item.status_kunjungan}<br>
            Revenue: Rp ${Number(item.potensi_revenue || 0).toLocaleString('id-ID')}
          `);
          markers.push(marker);
        }

        // Text Jarak
        const distanceText = item.distance !== 999999 
          ? `${item.distance.toFixed(1)} km` 
          : '-';

        const statusBadge = item.status_kunjungan === 'Sudah Dikunjungi'
          ? `<span class="badge badge-sudah">Sudah Visit</span>`
          : `<span class="badge badge-rencana">Rencana</span>`;

        const jsonRow = JSON.stringify(item).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

        tbody.innerHTML += `
          <tr>
            <td class="distance-tag">📍 ${distanceText}</td>
            <td><b>${item.nama_sekolah}</b></td>
            <td>${statusBadge}</td>
            <td>${item.tgl_kunjungan || '-'}</td>
            <td>Rp ${Number(item.potensi_revenue || 0).toLocaleString('id-ID')}</td>
            <td>
              <small><b>CP:</b> ${item.kontak_person || '-'}</small><br>
              <small><b>Notes:</b> ${item.catatan || '-'}</small>
            </td>
            <td>
              <button onclick='editSekolah(${jsonRow})' class="btn" style="padding:4px 8px; font-size:11px;">Edit</button>
              <button onclick='hapusSekolah(${item.id})' class="btn btn-danger" style="padding:4px 8px; font-size:11px;">Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    async function simpanSekolah() {
      const editId = document.getElementById('editId').value;
      const payload = {
        id: editId ? parseInt(editId) : Date.now(),
        nama_sekolah: document.getElementById('namaSekolah').value,
        status_kunjungan: document.getElementById('statusKunjungan').value,
        tgl_kunjungan: document.getElementById('tglKunjungan').value || null,
        potensi_revenue: parseFloat(document.getElementById('potensiRevenue').value) || 0,
        latitude: parseFloat(document.getElementById('latitude').value) || 0,
        longitude: parseFloat(document.getElementById('longitude').value) || 0,
        kontak_person: document.getElementById('kontakPerson').value,
        catatan: document.getElementById('catatan').value
      };

      if (!payload.nama_sekolah || !payload.latitude || !payload.longitude) {
        return alert("Nama sekolah, Latitude, dan Longitude wajib diisi!");
      }

      let error;
      if (editId) {
        const res = await supabaseClient.from('sekolah_visits').update(payload).eq('id', editId);
        error = res.error;
      } else {
        const res = await supabaseClient.from('sekolah_visits').insert([payload]);
        error = res.error;
      }

      if (error) {
        alert("Gagal menyimpan: " + error.message);
      } else {
        alert("Data sekolah berhasil disimpan!");
        resetFormSekolah();
        loadSekolahData();
      }
    }

    function editSekolah(item) {
      document.getElementById('editId').value = item.id;
      document.getElementById('namaSekolah').value = item.nama_sekolah;
      document.getElementById('statusKunjungan').value = item.status_kunjungan;
      document.getElementById('tglKunjungan').value = item.tgl_kunjungan || '';
      document.getElementById('potensiRevenue').value = item.potensi_revenue || 0;
      document.getElementById('latitude').value = item.latitude;
      document.getElementById('longitude').value = item.longitude;
      document.getElementById('kontakPerson').value = item.kontak_person || '';
      document.getElementById('catatan').value = item.catatan || '';

      document.getElementById('formTitle').innerText = "Edit Data Sekolah";
      document.getElementById('btnSimpanSekolah').innerText = "Update Data";
      window.scrollTo({ top: 350, behavior: 'smooth' });
    }

    async function hapusSekolah(id) {
      if(!confirm("Hapus data sekolah ini?")) return;
      const { error } = await supabaseClient.from('sekolah_visits').delete().eq('id', id);
      if(error) alert("Gagal hapus: " + error.message);
      else loadSekolahData();
    }

    function resetFormSekolah() {
      document.getElementById('editId').value = '';
      document.getElementById('namaSekolah').value = '';
      document.getElementById('tglKunjungan').value = '';
      document.getElementById('potensiRevenue').value = '';
      document.getElementById('latitude').value = '';
      document.getElementById('longitude').value = '';
      document.getElementById('kontakPerson').value = '';
      document.getElementById('catatan').value = '';
      document.getElementById('formTitle').innerText = "Tambah Data Sekolah";
      document.getElementById('btnSimpanSekolah').innerText = "Simpan Data";
    }

    // ==========================================
    // 5. CRUD CATATAN PRIBADI
    // ==========================================
    async function loadCatatanPribadi() {
      const { data, error } = await supabaseClient
        .from('catatan_pribadi')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return console.log("Gagal memuat catatan:", error.message);

      const container = document.getElementById('daftarCatatanContainer');
      container.innerHTML = '';

      if(data.length === 0) {
        container.innerHTML = '<p style="color:#777;">Belum ada catatan pribadi.</p>';
        return;
      }

      data.forEach(note => {
        const jsonNote = JSON.stringify(note).replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        container.innerHTML += `
          <div style="background:#f8f9fa; padding:12px; border-radius:8px; margin-bottom:10px; border-left:4px solid #007bff;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h4 style="margin:0; color:#333;">${note.judul}</h4>
              <div>
                <button onclick='editCatatan(${jsonNote})' class="btn" style="padding:2px 6px; font-size:11px;">Edit</button>
                <button onclick='hapusCatatan(${note.id})' class="btn btn-danger" style="padding:2px 6px; font-size:11px;">Hapus</button>
              </div>
            </div>
            <p style="margin:8px 0 0 0; font-size:13px; color:#555; white-space: pre-line;">${note.isi_catatan}</p>
          </div>
        `;
      });
    }

    async function simpanCatatan() {
      const editNoteId = document.getElementById('editNoteId').value;
      const payload = {
        id: editNoteId ? parseInt(editNoteId) : Date.now(),
        judul: document.getElementById('judulCatatan').value,
        isi_catatan: document.getElementById('isiCatatan').value
      };

      if (!payload.judul) return alert("Judul catatan wajib diisi!");

      let error;
      if (editNoteId) {
        const res = await supabaseClient.from('catatan_pribadi').update(payload).eq('id', editNoteId);
        error = res.error;
      } else {
        const res = await supabaseClient.from('catatan_pribadi').insert([payload]);
        error = res.error;
      }

      if (error) {
        alert("Gagal menyimpan catatan: " + error.message);
      } else {
        resetFormNote();
        loadCatatanPribadi();
      }
    }

    function editCatatan(note) {
      document.getElementById('editNoteId').value = note.id;
      document.getElementById('judulCatatan').value = note.judul;
      document.getElementById('isiCatatan').value = note.isi_catatan || '';
      document.getElementById('noteFormTitle').innerText = "Edit Catatan Pribadi";
      document.getElementById('btnSimpanNote').innerText = "Update Catatan";
    }

    async function hapusCatatan(id) {
      if(!confirm("Hapus catatan ini?")) return;
      const { error } = await supabaseClient.from('catatan_pribadi').delete().eq('id', id);
      if(error) alert("Gagal hapus: " + error.message);
      else loadCatatanPribadi();
    }

    function resetFormNote() {
      document.getElementById('editNoteId').value = '';
      document.getElementById('judulCatatan').value = '';
      document.getElementById('isiCatatan').value = '';
      document.getElementById('noteFormTitle').innerText = "Tambah Catatan Pribadi / Laporan";
      document.getElementById('btnSimpanNote').innerText = "Simpan Catatan";
    }

    // UTILITY TAB SWITCHING
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
