<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Map Tracker & CRM</title>
  
  <!-- Leaflet CSS & JS (Peta) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
       NEUMORPHISM GREEN THEME STYLES
       Base Color: #e6eee9 (Soft Greenish-Gray)
       ========================================== */
    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    
    body { 
      margin: 0; 
      padding: 0; 
      background: #e6eee9; 
      color: #2d3748; 
    }

    /* LOGIN CONTAINER */
    .login-wrapper { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
    }

    .login-card { 
      background: #e6eee9; 
      padding: 35px 25px; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 380px; 
      box-shadow: 9px 9px 18px #c8d3cc, -9px -9px 18px #ffffff; 
    }

    .login-card h2 { 
      text-align: center; 
      margin-top: 0; 
      margin-bottom: 25px; 
      color: #2e7d32; 
      font-weight: 700;
    }

    /* MAIN APP CONTAINER */
    #app-content { 
      display: none; 
      padding: 15px; 
      max-width: 1100px; 
      margin: 0 auto; 
    }
    
    /* NAVBAR */
    .navbar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #e6eee9; 
      padding: 15px 20px; 
      border-radius: 16px; 
      margin-bottom: 20px; 
      box-shadow: 6px 6px 12px #c8d3cc, -6px -6px 12px #ffffff; 
    }

    .navbar h3 { 
      margin: 0; 
      font-size: 18px; 
      color: #2e7d32; 
      font-weight: 700;
    }

    /* STATS / REVENUE CARD */
    .stats-card {
      background: #e6eee9;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 7px 7px 14px #c8d3cc, -7px -7px 14px #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-left: 6px solid #10b981;
    }

    .stats-info h4 {
      margin: 0;
      font-size: 13px;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stats-info .amount {
      font-size: 24px;
      font-weight: 800;
      color: #2e7d32;
      margin-top: 4px;
    }

    .stats-info .subtext {
      font-size: 12px;
      color: #718096;
      margin-top: 2px;
    }

    /* CARDS & PETA */
    .card { 
      background: #e6eee9; 
      padding: 20px; 
      border-radius: 18px; 
      margin-bottom: 25px; 
      box-shadow: 7px 7px 14px #c8d3cc, -7px -7px 14px #ffffff; 
    }

    .card h3 { 
      margin-top: 0; 
      font-size: 16px; 
      color: #1b4332;
      border-bottom: 2px solid #d1ded6; 
      padding-bottom: 10px; 
      margin-bottom: 18px;
    }

    #map { 
      height: 350px; 
      width: 100%; 
      border-radius: 18px; 
      margin-bottom: 25px; 
      box-shadow: inset 4px 4px 8px #c8d3cc, inset -4px -4px 8px #ffffff; 
      border: 3px solid #e6eee9;
      z-index: 1; 
    }

    /* FORM STYLES */
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
    }

    .form-group { 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
    }

    label { 
      font-size: 12px; 
      font-weight: 700; 
      color: #4a5568; 
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Inset Soft Input untuk Neumorphism */
    input, select, textarea { 
      width: 100%; 
      padding: 12px; 
      background: #e6eee9;
      border: none; 
      border-radius: 12px; 
      font-size: 14px; 
      color: #2d3748;
      box-shadow: inset 3px 3px 6px #c8d3cc, inset -3px -3px 6px #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      box-shadow: inset 1px 1px 2px #c8d3cc, inset -1px -1px 2px #ffffff, 0 0 0 2px #10b981;
    }

    /* BUTTONS */
    .btn { 
      background: linear-gradient(145deg, #328a37, #2a712d); 
      color: #fff; 
      border: none; 
      padding: 12px 18px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: 600; 
      box-shadow: 4px 4px 8px #c8d3cc, -4px -4px 8px #ffffff;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      box-shadow: inset 3px 3px 6px #225a24, inset -3px -3px 6px #3ea042;
    }

    .btn-secondary { 
      background: linear-gradient(145deg, #78828a, #656d74); 
      color: #fff;
    }

    .btn-secondary:active {
      box-shadow: inset 3px 3px 6px #50575d, inset -3px -3px 6px #909ca6;
    }

    .btn-danger, .btn-logout { 
      background: linear-gradient(145deg, #e53935, #c62828); 
      color: #fff; 
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 4px 4px 8px #c8d3cc, -4px -4px 8px #ffffff;
    }

    .btn-danger:active, .btn-logout:active {
      box-shadow: inset 3px 3px 6px #9a1f1f, inset -3px -3px 6px #f64343;
    }

    .btn-gps {
      background: linear-gradient(145deg, #059669, #047857);
    }

    .btn-info {
      background: linear-gradient(145deg, #0284c7, #0369a1);
      color: #fff;
    }

    /* TABLE STYLES */
    .table-responsive { 
      overflow-x: auto; 
      border-radius: 12px;
      box-shadow: inset 2px 2px 5px #c8d3cc, inset -2px -2px 5px #ffffff;
      padding: 5px;
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 13px; 
    }

    th, td { 
      padding: 12px; 
      text-align: left; 
    }

    th { 
      color: #2e7d32; 
      font-weight: 700;
      border-bottom: 2px solid #d1ded6;
    }

    td {
      border-bottom: 1px solid #dce5df;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* BADGES STATUS KUNJUNGAN */
    .badge { 
      display: inline-block; 
      padding: 5px 10px; 
      border-radius: 8px; 
      font-size: 11px; 
      font-weight: 700; 
      white-space: nowrap;
    }

    .badge-belum { 
      background: #fef3c7; 
      color: #92400e; 
      box-shadow: 2px 2px 4px #d2c8a4;
    }

    .badge-visit { 
      background: #e0f2fe; 
      color: #0369a1; 
      box-shadow: 2px 2px 4px #b8d4e8;
    }

    .badge-survey { 
      background: #f3e8ff; 
      color: #6b21a8; 
      box-shadow: 2px 2px 4px #d8c8e8;
    }

    .badge-closing { 
      background: #d1fae5; 
      color: #065f46; 
      box-shadow: 2px 2px 4px #accfbe;
    }

    .distance-tag { 
      color: #059669; 
      font-weight: 700; 
      white-space: nowrap;
    }

    .school-link {
      color: #2e7d32;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .school-link:hover {
      color: #10b981;
    }

    .action-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    /* MODAL FOR CATATAN */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #e6eee9;
      padding: 25px;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      box-shadow: 9px 9px 18px #c8d3cc, -9px -9px 18px #ffffff;
    }

    /* RESPONSIVE MEDIA QUERIES */
    @media (max-width: 600px) {
      body { padding: 0; }
      #app-content { padding: 10px; }
      .navbar { padding: 12px; }
      .navbar h3 { font-size: 15px; }
      #map { height: 280px; }
      .card { padding: 15px; border-radius: 14px; }
      .action-group { flex-direction: column; }
      .action-group .btn { width: 100%; margin-left: 0 !important; }
      .stats-card { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- 1. LAMAN LOGIN -->
  <div id="login-section" class="login-wrapper">
    <div class="login-card">
      <h2>Sales CRM</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom: 15px;">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="Masukkan email..." required>
        </div>
        <div class="form-group" style="margin-bottom: 25px;">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Masukkan password..." required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Masuk Aplikasi</button>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD UTAMA -->
  <div id="app-content">
    
    <!-- NAVBAR -->
    <div class="navbar">
      <h3>📍 Sales Tracker</h3>
      <button onclick="handleLogout()" class="btn-logout">Logout</button>
    </div>

    <!-- KARTU TOTAL REVENUE BULAN INI -->
    <div class="stats-card">
      <div class="stats-info">
        <h4 id="statTitleBulan">Total Revenue Bulan Ini</h4>
        <div class="amount" id="totalRevenueBulanIni">Rp 0</div>
        <div class="subtext" id="totalClosingCount">0 Sekolah Closing Done Bulan Ini</div>
      </div>
      <button onclick="loadSekolahData()" class="btn btn-secondary" style="font-size: 12px; padding: 8px 14px;">
        🔄 Refresh Data
      </button>
    </div>

    <!-- PETA UTAMA -->
    <div id="map"></div>

    <!-- FORM INPUT / UPDATE SEKOLAH -->
    <div class="card">
      <h3 id="formTitle">Tambah Data Sekolah</h3>
      <input type="hidden" id="editId">
      
      <div class="form-grid">
        <div class="form-group">
          <label>Nama Sekolah</label>
          <input type="text" id="namaSekolah" placeholder="Contoh: SMAN 1 Bandung" required>
        </div>
        <div class="form-group">
          <label>Status Kunjungan</label>
          <select id="statusKunjungan">
            <option value="Belum Di-visit">Belum Di-visit</option>
            <option value="Sudah Di-visit">Sudah Di-visit</option>
            <option value="Sudah Survey">Sudah Survey</option>
            <option value="Closing done">Closing done</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tanggal Kunjungan</label>
          <input type="date" id="tglKunjungan">
        </div>
        <div class="form-group">
          <label>Revenue (Rp)</label>
          <input type="number" id="potensiRevenue" placeholder="0">
        </div>
        <div class="form-group">
          <label>Latitude</label>
          <input type="text" id="latitude" placeholder="Klik di peta / GPS" required>
        </div>
        <div class="form-group">
          <label>Longitude</label>
          <input type="text" id="longitude" placeholder="Klik di peta / GPS" required>
        </div>
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label>Kontak Person (CP / HP)</label>
        <input type="text" id="kontakPerson" placeholder="Pak Budi - Kepsek (0812xxx)">
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label>Catatan Khusus Sekolah Ini</label>
        <textarea id="catatan" rows="3" placeholder="Tulis hasil pertemuan, kesepakatan, atau janji follow-up..."></textarea>
      </div>

      <div class="action-group">
        <button onclick="simpanSekolah()" class="btn" id="btnSimpanSekolah">Simpan Data</button>
        <button onclick="resetFormSekolah()" class="btn btn-secondary" id="btnBatal" style="display:none;">Batal Edit</button>
        <button onclick="getGPSLocation()" class="btn btn-gps" style="margin-left: auto;">📍 Lokasi Saya Saat Ini</button>
      </div>
    </div>

    <!-- TABEL DAFTAR SEKOLAH -->
    <div class="card">
      <h3>Daftar Sekolah (Urut Jarak Terdekat)</h3>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Jarak</th>
              <th>Nama Sekolah</th>
              <th>Status</th>
              <th>Tgl Visit</th>
              <th>Revenue</th>
              <th>Kontak</th>
              <th>Catatan</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelSekolahBody">
            <!-- Data Sekolah Di-render Otomatis -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODAL CATATAN SEKOLAH -->
  <div id="modalCatatan" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modalSchoolName" style="margin-top:0; color:#2e7d32;">Catatan Sekolah</h3>
      <p style="font-size:12px; color:#666;">Isi atau perbarui catatan khusus untuk sekolah ini:</p>
      <input type="hidden" id="modalSchoolId">
      <div class="form-group" style="margin-bottom: 15px;">
        <textarea id="modalCatatanText" rows="5" placeholder="Belum ada catatan..."></textarea>
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button onclick="tutupModalCatatan()" class="btn btn-secondary">Tutup</button>
        <button onclick="simpanModalCatatan()" class="btn">Simpan Catatan</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIG SUPABASE
    // ==========================================
    const SUPABASE_URL = "https://oqvqbgpcgxkdsjsfwegz.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable_CYObrBKZgPIZtLpr14VcYA_W3Nez0oi"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); 

    let map;
    let markers = [];
    let userLocation = null; 
    let currentSchoolsData = [];

    const namaBulan = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni", 
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    // ==========================================
    // 2. AUTHENTICATION (LOGIN / LOGOUT)
    // ==========================================
    window.onload = async function() {
      const { data: { session } } = await supabaseClient.auth.getSession(); 
      if (session) {
        showApp();
      } else {
        showLogin();
      }
    };

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value; 
      const password = document.getElementById('loginPassword').value; 

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password }); 

      if (error) {
        alert("Login Gagal: " + error.message);
      } else {
        showApp();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut(); 
      showLogin();
    }

    function showLogin() {
      document.getElementById('login-section').style.display = 'flex'; 
      document.getElementById('app-content').style.display = 'none'; 
    }

    function showApp() {
      document.getElementById('login-section').style.display = 'none'; 
      document.getElementById('app-content').style.display = 'block'; 
      initMap();
      getUserGPSAndLoadData();
    }

    // ==========================================
    // 3. PETA & GEOLOCATION
    // ==========================================
    function initMap() {
      if(map) return;
      map = L.map('map').setView([-6.9175, 107.6191], 12); 

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map); 

      map.on('click', function(e) {
        document.getElementById('latitude').value = e.latlng.lat.toFixed(6); 
        document.getElementById('longitude').value = e.latlng.lng.toFixed(6); 
      });
    }

    function getUserGPSAndLoadData() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            userLocation = [position.coords.latitude, position.coords.longitude]; 
            
            L.circle(userLocation, {
              color: '#059669',
              fillColor: '#10b981',
              fillOpacity: 0.3,
              radius: 120
            }).addTo(map).bindPopup("<b>Posisi Kamu Saat Ini</b>"); 

            map.setView(userLocation, 13); 
            loadSekolahData();
          },
          (error) => {
            loadSekolahData();
          }
        );
      } else {
        loadSekolahData();
      }
    }

    function getGPSLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          document.getElementById('latitude').value = pos.coords.latitude.toFixed(6); 
          document.getElementById('longitude').value = pos.coords.longitude.toFixed(6); 
          alert("Lokasi GPS berhasil diambil!"); 
        });
      } else {
        alert("Fitur GPS tidak didukung di browser ini."); 
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 999999; 
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180; 
      const dLon = (lon2 - lon1) * Math.PI / 180; 
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2); 
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      return R * c; 
    }

    // AUTO-LOAD & FOCUS PETA SAAT NAMA SEKOLAH DIKLIK
    function fokusKePeta(lat, lng) {
      if (!lat || !lng) return alert("Koordinat lokasi tidak valid!");

      map.flyTo([lat, lng], 16, {
        animate: true,
        duration: 1.5
      });

      markers.forEach(marker => {
        const pos = marker.getLatLng();
        if (Math.abs(pos.lat - lat) < 0.0001 && Math.abs(pos.lng - lng) < 0.0001) {
          marker.openPopup();
        }
      });

      document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
    }

    // ==========================================
    // 4. LOAD & RENDER DATA SEKOLAH & REVENUE
    // ==========================================
    async function loadSekolahData() {
      const { data, error } = await supabaseClient
        .from('sekolah_visits')
        .select('*'); 

      if (error) return alert("Gagal memuat sekolah: " + error.message); 

      currentSchoolsData = data.map(item => {
        let dist = 999999; 
        if (userLocation) {
          dist = calculateDistance(userLocation[0], userLocation[1], item.latitude, item.longitude); 
        }
        return { ...item, distance: dist };
      });

      currentSchoolsData.sort((a, b) => a.distance - b.distance); 
      renderSekolahUI();
      hitungRevenueBulanIni();
    }

    function hitungRevenueBulanIni() {
      const now = new Date();
      const currentMonth = now.getMonth(); 
      const currentYear = now.getFullYear();

      document.getElementById('statTitleBulan').innerText = `Total Revenue (${namaBulan[currentMonth]} ${currentYear})`;

      let totalRevenue = 0;
      let closingCount = 0;

      currentSchoolsData.forEach(item => {
        if (item.status_kunjungan === 'Closing done' && item.tgl_kunjungan) {
          const tglVisit = new Date(item.tgl_kunjungan);
          
          if (tglVisit.getMonth() === currentMonth && tglVisit.getFullYear() === currentYear) {
            totalRevenue += Number(item.potensi_revenue || 0);
            closingCount++;
          }
        }
      });

      document.getElementById('totalRevenueBulanIni').innerText = `Rp ${totalRevenue.toLocaleString('id-ID')}`;
      document.getElementById('totalClosingCount').innerText = `${closingCount} Sekolah Closing Done Bulan Ini`;
    }

    function renderSekolahUI() {
      markers.forEach(m => map.removeLayer(m)); 
      markers = []; 

      const tbody = document.getElementById('tabelSekolahBody'); 
      tbody.innerHTML = ''; 

      currentSchoolsData.forEach(item => {
        if (item.latitude && item.longitude) {
          const marker = L.marker([item.latitude, item.longitude]).addTo(map); 
          marker.bindPopup(`
            <b style="color:#2e7d32;">${item.nama_sekolah}</b><br>
            Status: ${item.status_kunjungan}<br>
            Revenue: Rp ${Number(item.potensi_revenue || 0).toLocaleString('id-ID')}
          `); 
          markers.push(marker); 
        }

        const distanceText = item.distance !== 999999 
          ? `${item.distance.toFixed(1)} km` 
          : '-'; 

        let statusBadge = '';
        if (item.status_kunjungan === 'Closing done') {
          statusBadge = `<span class="badge badge-closing">Closing Done</span>`;
        } else if (item.status_kunjungan === 'Sudah Survey') {
          statusBadge = `<span class="badge badge-survey">Sudah Survey</span>`;
        } else if (item.status_kunjungan === 'Sudah Di-visit') {
          statusBadge = `<span class="badge badge-visit">Sudah Di-visit</span>`;
        } else {
          statusBadge = `<span class="badge badge-belum">Belum Di-visit</span>`;
        }

        const jsonRow = JSON.stringify(item).replace(/'/g, "&apos;").replace(/"/g, "&quot;"); 

        tbody.innerHTML += `
          <tr>
            <td class="distance-tag">📍 ${distanceText}</td>
            <td>
              <a href="javascript:void(0)" onclick="fokusKePeta(${item.latitude}, ${item.longitude})" class="school-link">
                ${item.nama_sekolah}
              </a>
            </td>
            <td>${statusBadge}</td>
            <td>${item.tgl_kunjungan || '-'}</td>
            <td><b>Rp ${Number(item.potensi_revenue || 0).toLocaleString('id-ID')}</b></td>
            <td><small>${item.kontak_person || '-'}</small></td>
            <td>
              <button onclick='bukaModalCatatan(${jsonRow})' class="btn btn-info" style="padding:4px 8px; font-size:11px;">
                📝 Catatan
              </button>
            </td>
            <td>
              <div style="display:flex; gap:6px;">
                <button onclick='editSekolah(${jsonRow})' class="btn" style="padding:5px 10px; font-size:11px;">Update</button>
                <button onclick='hapusSekolah(${item.id})' class="btn btn-danger" style="padding:5px 10px; font-size:11px;">Hapus</button>
              </div>
            </td>
          </tr>
        `; 
      });
    }

    // ==========================================
    // 5. SIMPAN & UPDATE DATA SEKOLAH
    // ==========================================
    async function simpanSekolah() {
      const editId = document.getElementById('editId').value; 
      const payload = {
        id: editId ? parseInt(editId) : Date.now(), 
        nama_sekolah: document.getElementById('namaSekolah').value, 
        status_kunjungan: document.getElementById('statusKunjungan').value, 
        tgl_kunjungan: document.getElementById('tglKunjungan').value || null, 
        potensi_revenue: parseFloat(document.getElementById('potensiRevenue').value) || 0, 
        latitude: parseFloat(document.getElementById('latitude').value) || 0, 
        longitude: parseFloat(document.getElementById('longitude').value) || 0, 
        kontak_person: document.getElementById('kontakPerson').value, 
        catatan: document.getElementById('catatan').value 
      };

      if (!payload.nama_sekolah || !payload.latitude || !payload.longitude) {
        return alert("Nama sekolah, Latitude, dan Longitude wajib diisi!"); 
      }

      let error;
      if (editId) {
        const res = await supabaseClient.from('sekolah_visits').update(payload).eq('id', editId); 
        error = res.error;
      } else {
        const res = await supabaseClient.from('sekolah_visits').insert([payload]); 
        error = res.error;
      }

      if (error) {
        alert("Gagal menyimpan data: " + error.message); 
      } else {
        alert(editId ? "Data sekolah berhasil di-update!" : "Data sekolah berhasil ditambahkan!"); 
        resetFormSekolah();
        loadSekolahData();
      }
    }

    function editSekolah(item) {
      document.getElementById('editId').value = item.id; 
      document.getElementById('namaSekolah').value = item.nama_sekolah; 
      document.getElementById('statusKunjungan').value = item.status_kunjungan || 'Belum Di-visit'; 
      document.getElementById('tglKunjungan').value = item.tgl_kunjungan || ''; 
      document.getElementById('potensiRevenue').value = item.potensi_revenue || 0; 
      document.getElementById('latitude').value = item.latitude; 
      document.getElementById('longitude').value = item.longitude; 
      document.getElementById('kontakPerson').value = item.kontak_person || ''; 
      document.getElementById('catatan').value = item.catatan || ''; 

      document.getElementById('formTitle').innerText = "Update Data Sekolah"; 
      document.getElementById('btnSimpanSekolah').innerText = "Update Data"; 
      document.getElementById('btnBatal').style.display = 'inline-flex';
      
      document.getElementById('formTitle').scrollIntoView({ behavior: 'smooth' });
    }

    async function hapusSekolah(id) {
      if(!confirm("Apakah kamu yakin ingin menghapus data sekolah ini?")) return; 
      const { error } = await supabaseClient.from('sekolah_visits').delete().eq('id', id); 
      if(error) alert("Gagal hapus: " + error.message); 
      else loadSekolahData();
    }

    function resetFormSekolah() {
      document.getElementById('editId').value = ''; 
      document.getElementById('namaSekolah').value = ''; 
      document.getElementById('tglKunjungan').value = ''; 
      document.getElementById('potensiRevenue').value = ''; 
      document.getElementById('latitude').value = ''; 
      document.getElementById('longitude').value = ''; 
      document.getElementById('kontakPerson').value = ''; 
      document.getElementById('catatan').value = ''; 
      document.getElementById('statusKunjungan').value = 'Belum Di-visit';

      document.getElementById('formTitle').innerText = "Tambah Data Sekolah"; 
      document.getElementById('btnSimpanSekolah').innerText = "Simpan Data"; 
      document.getElementById('btnBatal').style.display = 'none';
    }

    // ==========================================
    // 6. MODAL CATATAN KHUSUS SEKOLAH
    // ==========================================
    function bukaModalCatatan(item) {
      document.getElementById('modalSchoolId').value = item.id;
      document.getElementById('modalSchoolName').innerText = `Catatan: ${item.nama_sekolah}`;
      document.getElementById('modalCatatanText').value = item.catatan || '';
      document.getElementById('modalCatatan').style.display = 'flex';
    }

    function tutupModalCatatan() {
      document.getElementById('modalCatatan').style.display = 'none';
    }

    async function simpanModalCatatan() {
      const id = document.getElementById('modalSchoolId').value;
      const newCatatan = document.getElementById('modalCatatanText').value;

      const { error } = await supabaseClient
        .from('sekolah_visits')
        .update({ catatan: newCatatan })
        .eq('id', id);

      if (error) {
        alert("Gagal memperbarui catatan: " + error.message);
      } else {
        alert("Catatan sekolah berhasil diperbarui!");
        tutupModalCatatan();
        loadSekolahData();
      }
    }
  </script>
</body>
</html>
